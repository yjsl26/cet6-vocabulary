<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e36">
  <title>每日六级 · 单词卡</title>
  <link rel="stylesheet" href="assets/style.css?v=2">
  <script defer src="data/words.js"></script>
  <script defer src="data/translation.js?v=2"></script>
  <script defer src="assets/core.js"></script>
  <script defer src="assets/app.js?v=2"></script>
</head>
<body>
<main>
  <header><span class="brand">CET·6 / 翻译重点词</span><span id="date"></span></header>
  <h1>每天一点，<br>词汇多一点。</h1>
  <p class="intro">聚焦六级翻译常见主题。点击看释义，按自己的节奏记。</p>
  <nav aria-label="学习范围"><button id="today" aria-pressed="true">今日新增</button><button id="all" aria-pressed="false">历史词库</button></nav>
  <p id="stats"></p>
  <section aria-label="单词学习">
    <p id="progress"></p>
    <p id="topic"></p>
    <button id="card" aria-label="点击单词显示释义"><span id="word"></span><span id="meaning" aria-live="polite"></span><span id="hint">点击查看释义</span></button>
    <div class="actions"><button id="next">下一个 →</button></div>
    <button id="restart" hidden>重新学习</button>
  </section>
  <p id="status" role="status"></p>
  <details><summary>查看累计词库</summary><ul id="library"></ul></details>
  <footer>六级翻译主题词与常用短语 · 新词库预置 120 条，每日开放 20 条（10 月 20—25 日）。<br>按常见主题编选，非官方词频榜。原有 8 词保留，进度保存在当前浏览器。<br><a href="data/SOURCES.md">查看选词依据与更新计划</a></footer>
</main>
</body>
</html>
